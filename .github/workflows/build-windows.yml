name: Build Windows Application (Rust / Tauri)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows (Rust / Tauri x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Build Tauri Windows Bundle & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Q-GUI (极龟) ${{ github.ref_name }} Preview"
          prerelease: true
          draft: false
          releaseBody: |
            ### ⚡️ Q-GUI (极龟) 预览版本 (Rust / Tauri 架构)

            新一代极致轻量、现代化 SAP GUI 快速启动与连接管理中枢！
            此版本为测试预览版（Pre-release），底层基于纯 Rust + Tauri 2.0 构建，内存占用极低（<20MB），启动瞬时。

            #### 包含文件
            - `Q-GUI_*_x64-setup.exe`: Windows 轻量级快速安装程序
            - `Q-GUI_*_x64.msi`: 企业级标准 Windows 安装包

            #### 核心亮点
            - 🦀 **纯 Rust 系统级后端**：基于原生 Windows 进程与 Socket 通信，内存占用从 150MB 骤降至 18MB。
            - 🛠️ **新增 sapshcut.exe 路径维护**：支持自定义路径、自动深度探测与文件浏览选择，解决各类 SAP GUI 非标准安装目录问题。
            - 🚀 **极速启动卡片矩阵**：实体晶片质感、多客户端快速切换、直达事务码。
            - 🔐 **连接保险库 (Vault)**：完备的网络与凭据维护、小眼睛明密文切换、一键复制分享、端口网络测速。
            - 🔮 **Raycast 极速 HUD 面板**：全局快捷键呼出，复合指令匹配直达。
            - 🌐 **局域网共享 (Q-AirDrop)**：内网 UDP 自动雷达发现，安全点对点推送连接。
            - ⚙️ **多主题与字号实时切换**：支持纯黑、深蓝、极简及三种字号比例。

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Q-GUI-Windows-Rust-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
