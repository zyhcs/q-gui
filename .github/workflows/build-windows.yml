name: Build Windows Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows Installer & Portable
        run: pnpm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Q-GUI-Windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Pre-Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          prerelease: true
          draft: false
          name: "Q-GUI (极龟) ${{ github.ref_name }} Preview"
          generate_release_notes: true
          body: |
            ### ⚡️ Q-GUI (极龟) 预览版本

            感谢体验新一代现代化 SAP GUI 快速启动与连接管理中枢！
            此版本为测试预览版（Pre-release），包含安装程序与绿色便携版。

            #### 包含文件
            - `Q-GUI Setup *.exe`: Windows 完整安装包（支持自定义安装路径、创建桌面快捷方式）
            - `Q-GUI *.exe`: 便携版 (Portable)，解压/双击即用

            #### 核心亮点
            - 🚀 **极速启动卡片矩阵**：实体晶片质感、多客户端快速切换、直达事务码
            - 🛠️ **连接保险库 (Vault)**：完备的网络与凭据维护、明密文切换、一键复制分享、端口网络测速
            - 🔮 **Raycast 极速 HUD 面板**：全局快捷键呼出，复合指令匹配直达
            - 🌐 **局域网共享 (Q-AirDrop)**：内网设备免配置发现，安全推拉连接
            - ⚙️ **多主题与字号实时切换**：支持纯黑、深蓝、极简及三种字号比例
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
